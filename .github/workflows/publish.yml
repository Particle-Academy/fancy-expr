name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  # One gate, stated once, that every installing job waits on. It used to sit
  # inline in a single job, which meant the other jobs installed unchecked --
  # a check that finishes beside the thing it guards is a report, not a gate.
  # Prism raised the distinction 2026-09-21; this repo is polyglot, so the
  # JS job was gated and the PHP/Python ones were not.
  allowlist:
    name: Third-party allowlist
    runs-on: ubuntu-latest
    # The only job here that lacked a cap (CodeQL
    # `actions/missing-workflow-permissions`, alert #2). It reads this repo and
    # fetches the allowlist with `persist-credentials: false`, so reading code is
    # all it needs. Capped per job rather than workflow-wide ON PURPOSE: the two
    # publishing jobs need `id-token: write` for Trusted Publishing, and a
    # workflow-level `contents: read` here would read as the safe choice while
    # breaking every release.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The allowlist is FETCHED, never vendored: one source, no copies to drift.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

  publish:
    needs: allowlist
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Release gate: a tag with no CHANGELOG entry fails HERE, before the
      # package reaches the registry. A published version whose changes are
      # undocumented cannot be fixed by editing the changelog afterwards — the
      # tarball is already out, and the agent upgrading into it has no way to
      # learn what broke.
      - name: Changelog entry for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::No CHANGELOG.md. Every package keeps one."
            exit 1
          fi
          if ! grep -qE "^## +\\[?v?${VERSION}\\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${VERSION}. Add one — say what a consumer must DO — then re-tag."
            exit 1
          fi
          # ORDER, not just presence. The check above asks only whether a
          # heading exists SOMEWHERE. fancy-flow's changelog had four sections
          # inserted ABOVE the [Unreleased] marker, so everything appended
          # since -- including 0.49.0 -- landed below them, and reading
          # top-down showed 0.48.1 as newest. That PASSED the presence check.
          #
          # A consumer deciding whether to upgrade reads top-down. Complete but
          # mis-ordered is a truthful-looking lie, and it is invisible to
          # whoever wrote it, because they are looking at their own entry
          # rather than at the file.
          FIRST=$(grep -E '^## ' CHANGELOG.md                   | grep -viE '^## +\[?unreleased\]?'                   | head -1)

          if ! printf '%s' "$FIRST" | grep -qE "^## +\[?v?${VERSION}\]?"; then
            echo "::error::CHANGELOG.md has an entry for ${VERSION}, but it is NOT the first version heading."
            echo "::error::Top of file is: ${FIRST}"
            echo "::error::Move this release above the older entries, then re-tag."
            exit 1
          fi

          echo "Found changelog entry for ${VERSION}, and it is the newest."

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install
      - run: npm run build
      # Trusted Publishing (OIDC) — no token. Trusted Publisher configured on
      # npmjs.com; the bootstrap NPM_TOKEN has been revoked.
      - name: Publish
        run: npx -y npm@11.18.0 publish --provenance --access public

      # ---------------------------------------------------------------------
      # Publish the GitHub release, from the changelog entry gated above.
      # ---------------------------------------------------------------------
      #
      # A package can be fully published and completely invisible on GitHub.
      # `fancy-flow-php` had v0.11.0 showing as "Latest" while the registry
      # served v0.42.0 -- 31 minors of shipped work, and anyone evaluating the
      # package by browsing it saw a project that looked abandoned. Reported by
      # a consumer, who noticed `gh release list` disagreed with what they had
      # installed.
      #
      # That was fixed in the PHP workflow and only there. Measured 2026-09-30:
      # of the TypeScript repos publishing to npm, **every one had zero GitHub
      # releases** -- react-fancy on 5.30.0 with 100 tags and an empty Releases
      # page. The PHP workflow's own comment names this failure mode: a fix
      # applied only where the problem was noticed is a fix the rest of the
      # estate never receives, and nothing reports that. It was happening in
      # the other direction.
      #
      # This runs AFTER the npm publish, deliberately. The npm tarball is
      # immutable, so a release announcing a version that failed to publish
      # could not be walked back; sequenced this way the release only ever
      # describes something a consumer can actually install.
      #
      # Automated rather than added to the ship checklist on purpose -- a
      # manual step is what produced the gap. The notes come from CHANGELOG.md,
      # so there is no second description to drift from the first.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it alone."
            exit 0
          fi

          # The section for this version, up to the next `## ` heading.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, v)) { found = 1 }; next }
            found { print }
          ' CHANGELOG.md > notes.md

          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          echo "Published release $GITHUB_REF_NAME."


  # ---------------------------------------------------------------------- #
  # PyPI
  #
  # Build and publish are separate jobs so `id-token: write` is never held by
  # the job that executes build code.
  # ---------------------------------------------------------------------- #
  build-python:
    needs: allowlist
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Require a CHANGELOG entry for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qE "^## +\[?v?${version}\]?" CHANGELOG.md || {
            echo "::error::No CHANGELOG.md entry for ${version}."
            exit 1
          }

      # The Python package declares its OWN version and it is the one that
      # reaches PyPI, so it -- not just package.json -- must match the tag.
      - name: Require python/pyproject.toml to match the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"${version}\"$" python/pyproject.toml || {
            echo "::error::python/pyproject.toml does not declare ${version}."
            exit 1
          }

      # `--sdist --wheel` explicitly. Bare `python -m build` builds the wheel
      # FROM the sdist, and fancy-conformance's first Python release died that
      # way when its force-include reached outside the package directory. This
      # package has no such include today; naming both targets keeps it that
      # way by construction rather than by luck.
      - name: Build
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel

      # `py.typed` is CLAIMED by the classifiers. Assert the wheel carries it
      # rather than trusting the file to be in the tree -- mypy against an
      # INSTALLED package is the only thing that asks a consumer's question,
      # and this package shipped without the marker until it was checked here.
      - name: The wheel carries py.typed
        working-directory: python
        run: |
          python -c "import glob,zipfile,sys; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); ok=any(x.endswith('py.typed') for x in n); print('py.typed in wheel:', ok); sys.exit(0 if ok else 1)"

      - uses: actions/upload-artifact@v7
        with:
          name: python-dists
          path: python/dist/

  publish-python:
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fancy-expr
    permissions:
      id-token: write        # mandatory for Trusted Publishing; there is no token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dists
          path: dist/
      # Pinned by SHA, not by tag: a mutable reference in exactly this position
      # is what the April 2026 supply-chain compromises exploited.
      # v1.14.2 -- no `password:` (that is the point), attestations default on.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

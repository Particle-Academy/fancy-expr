name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# THREE implementations, THREE required jobs. A language whose suite does not
# run in CI is a language whose agreement with the other two is a claim rather
# than a test result -- which is the exact failure this package's shared table
# exists to prevent, and it would be embarrassing to reproduce it here.
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The allowlist is FETCHED, never vendored: one source, no copies to
      # drift. This package has zero runtime dependencies by design -- it is a
      # sandbox, and every dependency would be code running against expressions
      # that arrive from end users and from agents over the wire.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          # Delete it. A fetched checkout left in the workspace is not inert --
          # vitest globbed a checker's own tests out of one and failed a package
          # whose code was fine.
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # NOT `npm test --if-present`. An absent script makes that step pass by
      # doing nothing, and a green tick over zero assertions is worse than a red
      # one.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4"]
    steps:
      - uses: actions/checkout@v4

      # A missing toolchain is a FAILURE, not a skip. `skipIf(!HAS_PHP)`
      # returning green is the mechanism that hid two-way drift for months in
      # two sibling repos, so PHP is installed here rather than detected.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install
        run: composer install --no-interaction --prefer-dist

      - name: Test
        run: vendor/bin/pest

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # TEMPORARY, AND IT IS A REAL GAP RATHER THAN A CONVENIENCE.
      # `fancy-conformance`'s Python loader has never been published --
      # `pip install fancy-conformance` 404s, and its repo's publish workflow
      # had no PyPI job until 2026-08-25. The job is now armed but the NAME
      # still needs a pending publisher from the owner, so until that first tag
      # lands there is nothing on PyPI to install.
      #
      # So the sibling is installed FROM SOURCE. `pyproject.toml` still declares
      # the honest PyPI dependency; this only supplies it early.
      #
      # DELETE THIS STEP, and the `--no-deps` below, the moment
      # `pip install fancy-conformance` works. Leaving it would mean this suite
      # silently stops testing against what consumers actually receive.
      #
      # At the TAG the Python suite pins (PINNED_SUITE_VERSION in
      # python/tests/test_conformance.py), never `main`. The pin is the contract:
      # moving it is a deliberate commit here, never a side effect of someone
      # else's release. With no `ref`, every fixture release could turn this job
      # red for a reason no commit in this repository caused; four sibling ports
      # sat red for weeks that way. A test fails if this ref and the pin disagree.
      - name: Check out the conformance fixtures (not yet on PyPI)
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/fancy-conformance
          ref: v0.22.0
          path: .fancy-conformance
          persist-credentials: false

      # `dependency-groups` (PEP 735), not an extra -- so it is `pip install
      # --group`, not `.[dev]`. Getting this wrong installs the package without
      # pytest and the next step fails for a reason unrelated to the code.
      # `--group` needs pip >= 25.1, so the upgrade is part of the step rather
      # than an assumption about the runner image.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./.fancy-conformance/python
          python -m pip install -e ./python
          # --no-deps so the group's `fancy-conformance` requirement does not
          # send pip to PyPI for a name that is not there yet. Everything else
          # in the group is a real PyPI package and installs normally.
          python -m pip install --group ./python/pyproject.toml:test --no-deps
          python -m pip install pytest

      - name: Lint
        run: |
          python -m pip install --group ./python/pyproject.toml:lint
          python -m ruff check python
          python -m ruff format --check python

      - name: Typecheck
        run: |
          python -m pip install --group ./python/pyproject.toml:typecheck
          python -m mypy --config-file python/pyproject.toml

      - name: Test
        working-directory: python
        run: python -m pytest -q

      # Proof the bridge above is still needed rather than forgotten. When this
      # step starts FAILING, `fancy-conformance` is on PyPI and the checkout
      # step plus `--no-deps` must both come out.
      - name: The PyPI gap is still open
        run: |
          if python -m pip download --no-deps --dest /tmp/probe fancy-conformance >/dev/null 2>&1; then
            echo "::error::fancy-conformance IS on PyPI now. Remove the source-checkout bridge in this workflow and install it normally."
            exit 1
          fi
          echo "fancy-conformance is still absent from PyPI; the source bridge above is still required." 

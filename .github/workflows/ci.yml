name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# THREE implementations, THREE required jobs. A language whose suite does not
# run in CI is a language whose agreement with the other two is a claim rather
# than a test result -- which is the exact failure this package's shared table
# exists to prevent, and it would be embarrassing to reproduce it here.
jobs:
  # One gate, stated once, that every installing job waits on. It used to sit
  # inline in a single job, which meant the other jobs installed unchecked --
  # a check that finishes beside the thing it guards is a report, not a gate.
  # Prism raised the distinction 2026-09-21; this repo is polyglot, so the
  # JS job was gated and the PHP/Python ones were not.
  allowlist:
    name: Third-party allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The allowlist is FETCHED, never vendored: one source, no copies to drift.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins.
        shell: bash
        env:
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

  node:
    needs: allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # NOT `npm test --if-present`. An absent script makes that step pass by
      # doing nothing, and a green tick over zero assertions is worse than a red
      # one.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  php:
    needs: allowlist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4"]
    steps:
      - uses: actions/checkout@v7

      # A missing toolchain is a FAILURE, not a skip. `skipIf(!HAS_PHP)`
      # returning green is the mechanism that hid two-way drift for months in
      # two sibling repos, so PHP is installed here rather than detected.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
        env:
          update: true # latest patch, not the runner's preinstalled one
      - name: Floor PHP at the PHP2Shell-patched release (CVE-2026-109618/109619)
        run: php -r '$v=$argv[1]??PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION.".".PHP_RELEASE_VERSION; $f=["8.5"=>"8.5.12","8.4"=>"8.4.27","8.3"=>"8.3.36","8.2"=>"8.2.35"][implode(".",array_slice(explode(".",$v),0,2))]??(version_compare($v,"8.6",">=")?"8.6":"8.2.35"); if(version_compare($v,$f,"<")){echo "::error::PHP $v is below the PHP2Shell floor $f".PHP_EOL;exit(1);} echo "PHP $v >= PHP2Shell floor $f".PHP_EOL;'

      - name: Install
        run: composer install --no-interaction --prefer-dist

      - name: Test
        run: vendor/bin/pest

  python:
    needs: allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The shared conformance fixtures and their Python loader. This is the
      # PERMANENT way the Python job gets them, not a bridge: `fancy-conformance`
      # is the suite's internal alignment tool, not a product, and is never
      # published to PyPI. So it is in no dependency group; the checkout's
      # `python/src` goes on PYTHONPATH in the Test step below, the same way
      # pyproject's pytest `pythonpath` finds it beside this repository in the
      # .agi envelope.
      #
      # At the TAG the Python suite pins (PINNED_SUITE_VERSION in
      # python/tests/test_conformance.py), never `main`. The pin is the contract:
      # moving it is a deliberate commit here, never a side effect of someone
      # else's release. With no `ref`, every fixture release could turn this job
      # red for a reason no commit in this repository caused; four sibling ports
      # sat red for weeks that way. A test fails if this ref and the pin disagree.
      - name: Check out fancy-conformance
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/fancy-conformance
          ref: v0.22.1
          path: .fancy-conformance
          persist-credentials: false

      # `dependency-groups` (PEP 735), not an extra -- so it is `pip install
      # --group`, not `.[dev]`. Getting this wrong installs the package without
      # pytest and the next step fails for a reason unrelated to the code.
      # `--group` needs pip >= 25.1, so the upgrade is part of the step rather
      # than an assumption about the runner image.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./python --group ./python/pyproject.toml:test

      - name: Lint
        run: |
          python -m pip install --group ./python/pyproject.toml:lint
          python -m ruff check python
          python -m ruff format --check python

      - name: Typecheck
        run: |
          python -m pip install --group ./python/pyproject.toml:typecheck
          python -m mypy --config-file python/pyproject.toml

      # pyproject's pytest `pythonpath` finds the shared `fancy_conformance`
      # loader at ../../fancy-conformance/python/src, which is where it sits in
      # the .agi envelope. Here the checkout is INSIDE the workspace, so that
      # path does not exist; PYTHONPATH points at the checkout this job made, at
      # the pinned tag, and the root is set so the fixtures read are that
      # checkout rather than a guess.
      - name: Test
        working-directory: python
        env:
          FANCY_CONFORMANCE_ROOT: ${{ github.workspace }}/.fancy-conformance
          PYTHONPATH: ${{ github.workspace }}/.fancy-conformance/python/src
        run: python -m pytest -q
